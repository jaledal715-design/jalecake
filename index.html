.stars-v{color:#e5a100;letter-spacing:1px}.rt{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-size:.85rem;text-align:left}.rt:hover{text-decoration:underline}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media (max-width:560px){.opts3{grid-template-columns:1fr}}
button.opt{background:var(--card);color:var(--ink);text-align:left;font:inherit;font-weight:600;width:100%}button.opt[aria-pressed="true"]{border-color:var(--p);background:var(--t);box-shadow:0 0 0 1px var(--p)}button.opt:focus-visible{outline:3px solid var(--p2);outline-offset:2px}

.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:var(--p);color:var(--on);font-weight:700;vertical-align:middle;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.tb{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}.tb button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;white-space:nowrap;cursor:pointer;color:var(--mut);font-weight:600}.tb button.on{color:var(--ink);border-color:var(--p)}.tb i{font-style:normal;background:var(--o);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 7px;margin-left:4px}

.mg{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}.chat{padding:0;display:flex;flex-direction:column;height:min(70vh,560px);overflow:hidden}.ch-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.ch-b{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}.bub{max-width:78%;padding:8px 12px;border-radius:14px;overflow-wrap:anywhere}.bub .who{display:block;font-size:.74rem;font-weight:800;margin-bottom:2px;opacity:.9}.bub small{display:block;font-size:.7rem;opacity:.7;margin-top:2px}.bub.me{align-self:flex-end;background:var(--p);color:var(--on);border-bottom-right-radius:4px}.bub.ot{align-self:flex-start;background:var(--t);border-bottom-left-radius:4px}.ch-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}

h1,h2,.brand,.pr,.stat b,.pc h3{font-family:var(--serif)}
h1{font-weight:700}.sub{color:var(--mut);margin:-4px 0 14px}
.announce{background:#5e1623;color:#f6e3c4;text-align:center;font-size:.8rem;letter-spacing:.06em;padding:7px 12px}
header{border-bottom:2px solid var(--o)}
.brand{font-weight:700}
.mk{border-radius:50%;background:#7a1f2e;color:#fff;border:2px solid #d4a64a;font-family:var(--serif);font-weight:700}
